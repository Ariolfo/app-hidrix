<ion-header class="login-header">
  <ion-toolbar>
    <ion-title class="wordmark">
      <span class="brand-primary">Hidr</span><span class="brand-accent">ix</span>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">
  <div class="hero">
    <img src="assets/logo_hidrix.jpeg" alt="Hidrix" class="logo" />
    <p>Inicia sesión para ver estaciones de humedad cercanas.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list lines="none" class="form-list">

      <ion-item class="outlined">
        <ion-input
          label="Correo electrónico"
          labelPlacement="stacked"
          formControlName="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="correo@ejemplo.com"
        ></ion-input>
      </ion-item>

      <ion-item class="outlined">
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="Tu contraseña"
        >
          <ion-button
            slot="end"
            fill="clear"
            size="small"
            (click)="showPassword = !showPassword"
            aria-label="Mostrar contraseña"
          >
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-input>
      </ion-item>

    </ion-list>

    <div class="actions">
      <ion-button
        expand="block"
        type="submit"
        [disabled]="submitting"
        color="primary"
        class="cta"
      >
        <ion-spinner *ngIf="submitting" name="crescent"></ion-spinner>
        <ng-container *ngIf="!submitting">
          <span>Iniciar sesión</span>
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ng-container>
      </ion-button>

      <p class="switch-link">
        ¿No tienes cuenta?
        <ion-button fill="clear" size="small" (click)="goToRegister()">Regístrate</ion-button>
      </p>
    </div>
  </form>
</ion-content>
