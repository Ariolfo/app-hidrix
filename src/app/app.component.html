<ion-app>
  <ion-menu menuId="main-menu" contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Hidrix</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list lines="none">
        <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages">
          <ion-item button detail="false" (click)="openPage(p.url)">
            <ion-icon slot="start" [name]="p.icon"></ion-icon>
            <ion-label>{{ p.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ng-container *ngIf="isAdmin">
          <ion-menu-toggle
            auto-hide="false"
            *ngFor="let p of adminAppPages"
          >
            <ion-item button detail="false" (click)="openPage(p.url)">
              <ion-icon slot="start" [name]="p.icon"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ng-container>

        <ion-accordion-group *ngIf="isAdmin">
          <ion-accordion value="admin">
            <ion-item slot="header">
              <ion-icon slot="start" name="settings-outline"></ion-icon>
              <ion-label>Admin</ion-label>
            </ion-item>
            <div class="admin-items" slot="content">
              <ion-menu-toggle
                auto-hide="false"
                *ngFor="let p of adminPages"
              >
                <ion-item
                  button
                  detail="false"
                  class="admin-item"
                  (click)="openPage(p.url)"
                >
                  <ion-icon slot="start" [name]="p.icon"></ion-icon>
                  <ion-label>{{ p.title }}</ion-label>
                </ion-item>
              </ion-menu-toggle>
            </div>
          </ion-accordion>
        </ion-accordion-group>

        <ion-menu-toggle auto-hide="false">
          <ion-item button detail="false" lines="none" (click)="logout()">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
